<div align="center">
  <p><font size="3"><b><font size="4">『しょうがくせいのみなさんへ』</font></b></font></p>
  <p>　</p>
  <p>このゲームは、おっきいおともだちのためのゲームです。</p>
  <p>しょうがくせいのみなさんがこのゲームであそぶのは、</p>
  <p>まだはやいです。</p>
  <p>このホームページにあそびにくるのは、</p>
  <p>もっとおとなになってからにしましょう。</p>
  <p>どうしてあそんではいけないのかわからないときは、</p>
  <p>おとうさんかおかあさんにきいてみましょう。</p>
  </div>
